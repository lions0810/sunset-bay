<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Bay — a tiny open-world crime game</title>
<style>
  html, body { margin: 0; padding: 0; background: #10131c; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh;
         font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif; }
  #frame { position: relative; width: 960px; height: 540px; box-shadow: 0 18px 60px rgba(0,0,0,.55); }
  canvas { display: block; width: 960px; height: 540px; background: #2e4a3a; }
  #hint { position: absolute; left: 10px; bottom: 8px; color: rgba(255,255,255,.72);
          font-size: 12px; letter-spacing: .02em; text-shadow: 0 1px 2px rgba(0,0,0,.8); pointer-events: none; }
</style>
</head>
<body>
  <div id="frame">
    <canvas id="game" width="960" height="540"></canvas>
    <div id="hint">WASD / arrows move &nbsp;·&nbsp; E enter / exit car &nbsp;·&nbsp; Space handbrake &nbsp;·&nbsp; Enter start</div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
