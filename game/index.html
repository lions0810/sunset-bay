<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Bay — a tiny open-world crime game</title>
<style>
  html, body { margin: 0; padding: 0; background: #14101d; height: 100%; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-family: Georgia, 'Times New Roman', serif; }
  canvas { background: #20303a; box-shadow: 0 10px 44px rgba(0,0,0,.55); border-radius: 4px; max-width: 96vw; height: auto; }
  #status { color: #cbb7a0; font-size: 14px; min-height: 18px; text-align: center; }
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<div id="status" role="status" aria-live="polite">Loading Sunset Bay…</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
